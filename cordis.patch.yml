# dsh-memory —— DSH bundle 补丁层，由 package.json 的 dsh.bundle.patch 指向本文件。
# 用户要改配置时，在自己的 profile 里用同一个 id 覆盖：config 是整块替换、不做深合并。
- insert:
    - id: dsh-memory
      name: "@jinshuxuan/dsh-memory/dsh"   # 对应 package.json exports["./dsh"]
      config:
        enabled: true                      # 总开关：false 即完全不加载
        gate: assist                       # off 不注入 / shadow 只记录 / assist 命中即注入
        extractor:
          enabled: false                   # 默认关 LLM 抽取，只用规则，零 API 花费